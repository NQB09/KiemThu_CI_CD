name: Selenium Cross-Browser Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Định nghĩa ma trận để chạy song song 2 luồng độc lập: một cho chrome, một cho firefox
    strategy:
      matrix:
        browser: [chrome, firefox]
      fail-fast: false # Nếu một trình duyệt bị fail, trình duyệt còn lại vẫn tiếp tục chạy bình thường

    steps:
      # Bước 1: Lấy mã nguồn
      - name: Checkout code
        uses: actions/checkout@v3

      # Bước 2: Thiết lập môi trường Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Bước 3: Kiểm tra ma trận để cài đặt đúng trình duyệt tương ứng
      - name: Install Browser
        run: |
          if [ "${{ matrix.browser }}" = "chrome" ]; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          elif [ "${{ matrix.browser }}" = "firefox" ]; then
            sudo apt-get update
            sudo apt-get install -y firefox
          fi

      # Bước 4: Lưu bộ nhớ đệm (Cache) thư viện Maven
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Bước 5: Chạy lệnh test và truyền tham số trình duyệt vào thuộc tính hệ thống của Maven (-Dbrowser)
      - name: Run tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: mvn clean test -Dbrowser=${{ matrix.browser }}

      - name: Generate Allure report
        if: always() # Thêm dòng này để chắc chắn test fail vẫn xuất được report công phu
        run: mvn allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-report-${{ matrix.browser }} # Thêm biến browser để phân biệt report của 2 trình duyệt
          path: target/site/allure-maven-plugin/

      # Bước 6: Tải kết quả báo cáo của riêng từng trình duyệt lên Artifact
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports-${{ matrix.browser }}
          path: target/surefire-reports/